      - AUTH_REQUIRED
      - SESSION_EXPIRED
      - CSRF_INVALID
      - PERMISSION_DENIED
      - DATA_SCOPE_DENIED
      - FIELD_FORBIDDEN
      - NOT_FOUND
      - VALIDATION_FAILED
      - CONFLICT_VERSION
      - IDEMPOTENCY_REPLAY_MISMATCH
      - ILLEGAL_TRANSITION
      - SOD_VIOLATION
      - SELF_APPROVAL_FORBIDDEN
      - PAYLOAD_HASH_MISMATCH
      - AMOUNT_LIMIT_EXCEEDED
      - PERIOD_CLOSED
      - LEDGER_UNBALANCED
      - PLACEHOLDER_ACCOUNT_CODE
      - UNVERIFIED_RULE_VERSION
      - AI_MODE_OFF
      - AI_AUTONOMY_CAPPED
      - AI_INITIATOR_MISMATCH
      - RATE_LIMITED
      - MODULE_DISABLED
      - UPSTREAM_UNAVAILABLE
      - DELEGATION_INVALID
      - DELEGATION_SCOPE_EXCEEDED
      - PERMISSIONS_CHANGED
      - SCENARIO_READ_ONLY
      - INTERNAL
    Money:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          description: 万分位整数（SCALE=10000），1.2300 → 12300；与前端 utils/money.ts 的 Minor 一致
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amountMinor
      - currency
      description: 金额一律用万分位整数 + 币种，不用浮点
    CurrencyCode:
      type: string
      enum:
      - CNY
      - USD
      - EUR
      - GBP
      - JPY
      description: ISO 4217；本位币 CNY
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
      required:
      - page
      - pageSize
      - total
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
      - items
      - page
      - pageSize
      - total
      description: 分页信封；items 字段结构以前端 src/types 下同名类型为准
    Record:
      type: object
      additionalProperties: true
      description: 字段以前端 src/types/*.ts 对应类型为准（草案阶段未逐字段展开）

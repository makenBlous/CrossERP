security:
- sessionCookie: []
- apiToken: []
- delegationToken: []
paths:
  /api/v1/health:
    get:
      operationId: apiHealth
      tags:
      - 平台底座
      summary: JSON API 健康检查
      responses:
        '200':
          description: 成功
      x-crosserp:
        permission: public
        riskTier: none
        entity: Health
        action: Health.read
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags:
      - 平台底座
      summary: 账号密码登录，建立会话 Cookie 并返回 CSRF 令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      x-crosserp:
        permission: public
        auditLog: 写操作日志
        aiCallable: 不可调用
        aiMaxAutonomy: L0
        riskTier: critical
        pages:
        - A01
        source: 已有后端服务可复用
        frontendFunctions: []
        entity: UserAccount
        action: UserAccount.login
        actionKind: command
  /api/v1/auth/logout:

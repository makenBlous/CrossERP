openapi: 3.1.0
info:
  title: CrossERP API 草案
  version: 0.4.0-draft
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 由 08-后端模块与API设计.md 生成的草案。JSON 字段 camelCase；金额万分位整数（Money）；时间 UTC ISO-8601。每个操作都是一个实体动作的投影（x-crosserp.entity / action，实体目录见 ontology-entities.yaml）。x-crosserp 扩展给出权限点、操作日志、AI 可调用性与自主等级上限、对应前端页面。未逐字段展开的结构以前端
    src/types 为准。

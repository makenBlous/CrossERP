  /api/v1/files:
    post:
      operationId: postFiles
      tags:
      - 平台底座
      summary: 上传文件（multipart），返回 file_id 与 SHA-256，供导入、附件、票据收件箱复用
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                meta:
                  type: string
                  description: JSON 字符串
              required:
              - file
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRef'
        '400':

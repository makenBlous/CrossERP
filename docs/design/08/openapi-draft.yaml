  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crosserp_session
      description: 浏览器会话；写请求另需 X-CSRF-Token
    apiToken:
      type: http
      scheme: bearer
      description: 个人 API Token / MCP Token（只存哈希）
    delegationToken:
      type: http
      scheme: bearer
      description: 委托通行证（agent 代表登录人调用；默认 SDK 嵌入模式下在进程内传递、不走 HTTP；此方案仅供可选的外部 MCP 模式使用；系统自动签发、静默续期、自动作废，用户无感）
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Q:
      name: q
      in: query
      schema:
        type: string
      description: 关键字；其余筛选按资源追加（storeId、period、status、from、to）
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: -createdAt
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Cookie 会话的写请求必填；API Token 调用免
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: 写操作建议必带；同键同体 24h 内返回首次结果，同键异体返回 409 IDEMPOTENCY_REPLAY_MISMATCH
  responses:
    BadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或会话过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权限/超出数据范围/职责分离/AI 等级上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 不存在或无权查看（不区分，防枚举）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 版本冲突、内容哈希不一致、非法状态转移、幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 业务校验失败（借贷不平、期间已结账、占位科目编码、规则未核实）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:

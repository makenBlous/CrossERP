- id: Approval
  nameZh: 审批单
  module: wf（审批中心）
  kind: entity
  properties:
  - 'approvalId: id'
  - 'type: string'
  - 'targetType: string'
  - 'targetId: id'
  - 'payloadHash: string'
  - 'submitter: id'
  - 'onBehalfOf: id?'
  - 'origin: enum(human/agent)'
  - 'step: int'
  - 'resolution: enum(approver/no_approver_auto/initiator_confirm)'
  - 'resolvedApprovers: id[]'
  - 'ruleId: id?'
  - 'resolutionNote: string'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - approves → *
  stateMachine:
    states:
    - draft
    - pending
    - auto_effective
    - awaiting_initiator
    - approved
    - withdrawn
    - rejected
    - exported
    transitions:
    - draft → pending：submit（触发：Approval 由业务单据 submit 创建；审批人解析器决定进入 pending / auto_effective / awaiting_initiator）
    - draft → auto_effective：submit（触发：Approval 由业务单据 submit 创建；审批人解析器决定进入 pending / auto_effective / awaiting_initiator）
    - draft → awaiting_initiator：submit（触发：Approval 由业务单据 submit 创建；审批人解析器决定进入 pending / auto_effective / awaiting_initiator）
    - awaiting_initiator → approved：initiator_confirm（触发：Approval.initiator_confirm）
    - awaiting_initiator → withdrawn：withdraw（触发：Approval.withdraw）
    - pending → approved：decide（触发：Approval.decide）
    - pending → rejected：decide（触发：Approval.decide）
    - pending → withdrawn：withdraw（触发：Approval.withdraw）
    - approved → exported：export（触发：ledger 唯一写账出口）
    - rejected → draft：revise（触发：原单据修改后再次 submit）
  actions:
  - id: Approval.list
    kind: 查询
    summary: 审批列表（scope=todo/submitted/cc/agent/all）
    permission: approval:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/approvals
  - id: Approval.get
    kind: 查询
    summary: 审批详情（内容哈希、证据、链路）
    permission: approval:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/approvals/{id}
  - id: Approval.decide
    kind: 命令
    summary: 批准/驳回（唯一决定入口；校验内容哈希、职责分离、轮次；不能审批自己提交或 AI 代自己提交的单）
    permission: approval:approve
    aiMaxAutonomy: L0（仅真人）
    riskTier: 危：agent 禁用
    emits:
    - approval.decided
    projections:
    - POST /api/v1/approvals/{id}/decide
  - id: Approval.withdraw
    kind: 命令
    summary: 提交人撤回待审批单
    permission: approval:create
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - approval.withdrawn
    projections:
    - POST /api/v1/approvals/{id}/withdraw
  - id: Approval.initiator_confirm
    kind: 命令
    summary: 发起人本人确认（AI 发起的高风险或钱账动作解析不到可用审批人时，退回发起人本人确认后才生效；留痕「无审批人，发起人确认」）
    permission: approval:create
    aiMaxAutonomy: L0（仅真人）
    riskTier: 危：agent 禁用
    emits:
    - approval.initiator_confirm.done
    projections:
    - POST /api/v1/approvals/{id}/initiator-confirm

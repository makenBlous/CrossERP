entityTypes:
- id: UserAccount
  nameZh: 账号与会话
  module: platform（平台底座）
  kind: entity
  properties:
  - 'userId: id'
  - 'username: string'
  - 'displayName: string'
  - 'roles: Role[]'
  - 'timezone: string'
  - 'mfaEnabled: bool'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - hasRole → Role
  - isEmployee → Employee
  - ownsSession → Session
  stateMachine:
    states:
    - active
    - locked
    - disabled
    transitions:
    - active → locked：lock（触发：system（后台任务、定时器或到期自动推进））
    - locked → active：unlock（触发：UserAccount.update（推断：作为字段更新处理，实现时可拆成独立动作））
    - active → disabled：disable（触发：UserAccount.update（推断：作为字段更新处理，实现时可拆成独立动作））
  actions:
  - id: UserAccount.login
    kind: 命令
    summary: 账号密码登录，建立会话 Cookie 并返回 CSRF 令牌
    permission: public
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.login.done
    projections:
    - POST /api/v1/auth/login
  - id: UserAccount.logout
    kind: 命令
    summary: 退出登录，作废会话并作废该会话发起的进行中智能体请求
    permission: authenticated
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.logout.done
    projections:
    - POST /api/v1/auth/logout
  - id: UserAccount.read_me
    kind: 查询
    summary: 当前用户、角色、有效权限点、数据范围、AI 模式（前端 session/permission store 的唯一来源）
    permission: authenticated
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/auth/me
  - id: UserAccount.forgot_password
    kind: 命令
    summary: 发起找回密码（发邮件链接，阶段：later）
    permission: public
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.forgot_password.done
    projections:
    - POST /api/v1/auth/forgot-password
  - id: UserAccount.reset_password
    kind: 命令
    summary: 凭一次性令牌重置密码（阶段：later）
    permission: public
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.reset_password.done
    projections:
    - POST /api/v1/auth/reset-password
  - id: UserAccount.list
    kind: 查询
    summary: 我的资料
    permission: user:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/account/profile
    - GET /api/v1/account/sessions
  - id: UserAccount.update
    kind: 命令
    summary: 修改我的资料（显示名、语言、时区）
    permission: user:write
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.updated
    projections:
    - PATCH /api/v1/account/profile
  - id: UserAccount.create
    kind: 命令
    summary: 修改密码
    permission: user:write
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.created
    projections:
    - POST /api/v1/account/password
  - id: UserAccount.delete
    kind: 命令
    summary: 强制下线某个会话
    permission: user:write
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - user_account.deleted
    projections:
    - DELETE /api/v1/account/sessions/{id}
  - id: UserAccount.read_data_scope
    kind: 查询
    summary: 我的数据范围说明（店铺/部门/本人）及按范围过滤后的示例计数
    permission: user:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/me/data-scope
- id: ApiToken
  nameZh: 个人 API 令牌
  module: platform（平台底座）
  kind: config
  properties:
  - 'tokenId: id'
  - 'ownerId: id'
  - 'scopes: string[]'
  - 'hashSha256: string'
  - 'expiresAt: datetime'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - ownedBy → UserAccount
  stateMachine:
    states:
    - active
    - revoked
    - expired
    transitions:
    - active → revoked：revoke（触发：ApiToken.revoke）
    - active → expired：expire（触发：system（后台任务、定时器或到期自动推进））
  actions:
  - id: ApiToken.list
    kind: 查询
    summary: 我的 API Token 列表（只显示名称和前缀）
    permission: user:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/account/tokens
  - id: ApiToken.create
    kind: 命令
    summary: 新建 API Token（明文只返回一次）
    permission: user:write
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - api_token.created
    projections:
    - POST /api/v1/account/tokens
  - id: ApiToken.revoke
    kind: 命令
    summary: 吊销 API Token
    permission: user:write
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - api_token.revoked
    projections:
    - POST /api/v1/account/tokens/{id}/revoke
- id: FileObject
  nameZh: 文件
  module: platform（平台底座）
  kind: record
  properties:
  - 'fileId: id'
  - 'sha256: string'
  - 'size: int'
  - 'contentType: string'
  - 'uploadedBy: id'
  relations:
  - attachedTo → *
  actions:
  - id: FileObject.create
    kind: 命令
    summary: 上传文件（multipart），返回 file_id 与 SHA-256，供导入、附件、票据收件箱复用
    permission: authenticated
    aiMaxAutonomy: L3
    riskTier: 低：自动执行（不改业务数据或只产生可重算的派生结果）
    emits:
    - file_object.created
    projections:
    - POST /api/v1/files
  - id: FileObject.get
    kind: 查询
    summary: 下载文件（按所属单据权限校验；敏感文件记访问日志）
    permission: authenticated
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/files/{id}
- id: Job
  nameZh: 后台任务
  module: platform（平台底座）
  kind: record
  properties:
  - 'jobId: id'
  - 'kind: string'
  - 'status: enum'
  - 'progress: number'
  - 'createdBy: id'
  relations:
  - produces → *
  stateMachine:
    states:
    - queued
    - running
    - succeeded
    - failed
    - cancelled
    transitions:
    - queued → running：start（触发：system（后台任务、定时器或到期自动推进））
    - running → succeeded：finish（触发：system（后台任务、定时器或到期自动推进））
    - running → failed：fail（触发：system（后台任务、定时器或到期自动推进））
    - queued → cancelled：cancel（触发：system（任务取消由发起动作的 cancel 联动））
  actions:
  - id: Job.get
    kind: 查询
    summary: 查询后台任务进度（导入、对账、同步、算薪、重建索引）
    permission: authenticated
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/jobs/{id}
- id: Store
  nameZh: 店铺
  module: platform（平台底座）
  kind: entity
  twin:
    syncSource: 平台授权与结算报告
    syncFrequency: 每日+事件
    fidelity: 见 08 文档第 9.5 节；真实使用前需核实频率
    snapshots: 日终 + 月结 + 关键事件
  properties:
  - 'storeId: id'

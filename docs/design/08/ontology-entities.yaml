- id: TwinScenario
  nameZh: 推演（孪生副本）
  module: twin（数字孪生与推演）
  kind: entity
  properties:
  - 'scenarioId: id'
  - 'baseSnapshotId: id'
  - 'assumptions: Record'
  - 'simulatedActions: {actionId,params}[]'
  - 'results: Record'
  - 'owner: id'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - forkOf → TwinSnapshot
  - proposes → AgentSuggestion
  stateMachine:
    states:
    - draft
    - simulated
    - promoted
    - archived
    transitions:
    - draft → simulated：simulate（触发：TwinScenario.simulate）
    - simulated → promoted：promote（触发：TwinScenario.promote）
    - draft → archived：archive（触发：TwinScenario.archive）
    - simulated → archived：archive（触发：TwinScenario.archive）
  actions:
  - id: TwinScenario.create
    kind: 命令
    summary: 新建推演（从快照或当前状态派生孪生副本）
    permission: report:create
    aiMaxAutonomy: L3
    riskTier: 低：自动执行（不改业务数据或只产生可重算的派生结果）
    emits:
    - twin_scenario.created
    projections:
    - POST /api/v1/twin/scenarios
  - id: TwinScenario.get
    kind: 查询
    summary: 推演详情与假设
    permission: report:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/twin/scenarios/{id}
  - id: TwinScenario.simulate
    kind: 命令
    summary: 在副本上执行实体动作（补货、调价、改费率），只写副本
    permission: report:create
    aiMaxAutonomy: L3
    riskTier: 低：自动执行（不改业务数据或只产生可重算的派生结果）
    emits:
    - twin_scenario.simulated
    projections:
    - POST /api/v1/twin/scenarios/{id}/simulate
  - id: TwinScenario.read_diff
    kind: 查询
    summary: 推演结果与基线对比（库存天数、现金、毛利）
    permission: report:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/twin/scenarios/{id}/diff
  - id: TwinScenario.promote
    kind: 命令
    summary: 把推演中选定的动作转成真实草稿，逐条按原动作权限复核并走审批
    permission: report:submit
    aiMaxAutonomy: L2
    riskTier: 高：agent 可发起，须人工审核后生效
    emits:
    - twin_scenario.promoted
    projections:
    - POST /api/v1/twin/scenarios/{id}/promote
  - id: TwinScenario.archive
    kind: 命令
    summary: 归档推演（副本只读保留）
    permission: report:write
    aiMaxAutonomy: L3
    riskTier: 低：自动执行（不改业务数据或只产生可重算的派生结果）
    emits:
    - twin_scenario.archived
    projections:
    - POST /api/v1/twin/scenarios/{id}/archive

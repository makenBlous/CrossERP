- id: TwinDrift
  nameZh: 孪生偏差
  module: twin（数字孪生与推演）
  kind: entity
  properties:
  - 'handler: enum(agent/uploader/admin)'
  - 'agentAttempts: int'
  - 'assigneeUserId: id?(默认=数据源上传人/负责人)'
  - 'moneyImpact: bool'
  - 'driftId: id'
  - 'entityType: string'
  - 'entityId: id'
  - 'field: string'
  - 'systemValue: any'
  - 'externalValue: any'
  - 'externalSource: string'
  - 'detectedAt: datetime'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - about → *
  - correctedBy → StockCount
  - correctedBy → Voucher
  stateMachine:
    states:
    - open
    - resolving
    - closed
    - accepted
    - escalated
    transitions:
    - open → resolving：resolve（触发：TwinDrift.resolve）
    - resolving → closed：close（触发：system（纠偏单据过账后自动关闭））
    - open → accepted：accept（触发：TwinDrift.accept）
    - open → escalated：escalate（触发：TwinDrift.escalate）
    - escalated → resolving：resolve（触发：TwinDrift.resolve）
    - escalated → accepted：accept（触发：TwinDrift.accept）
  actions:
  - id: TwinDrift.list
    kind: 查询
    summary: 孪生偏差：系统状态与外部事实（平台库存、银行流水、物流轨迹）对不上的地方
    permission: report:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/twin/drifts
  - id: TwinDrift.resolve
    kind: 命令
    summary: 纠偏（agent 优先处理）：非钱账偏差可直接修正；钱和账偏差只生成盘点/调整/冲销草稿走审批
    permission: stock_reconciliation:create
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - twin_drift.resolved
    projections:
    - POST /api/v1/twin/drifts/{id}/resolve
  - id: TwinDrift.accept
    kind: 命令
    summary: 确认偏差属于已知时间差或口径差，不纠偏（写原因；agent 可处理非钱账偏差，钱和账偏差须人确认）
    permission: stock_reconciliation:approve
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - twin_drift.accept.done
    projections:
    - POST /api/v1/twin/drifts/{id}/accept
  - id: TwinDrift.escalate
    kind: 命令
    summary: agent 自动处理未果时转交该数据源的上传人/负责人（附尝试记录与证据）
    permission: stock_reconciliation:create
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - twin_drift.escalated
    projections:
    - POST /api/v1/twin/drifts/{id}/escalate

- id: IngestBatch
  nameZh: 导入批次
  module: ingest（数据进入与溯源）
  kind: entity
  properties:
  - 'batchId: id'
  - 'source: enum(file/api/sync)'
  - 'kind: enum(settlement/order/ads/attendance/opening/inventory/…)'
  - 'fileSha256: string'
  - 'mappingRuleVersion: string'
  - 'counts: {landed,valid,duplicate,quarantined,projected}'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - contains → RawRecord
  - raises → CleansingIssue
  - uses → MappingRule
  stateMachine:
    states:
    - uploaded
    - landed
    - cleansed
    - projected
    - failed
    - superseded
    transitions:
    - uploaded → landed：land（触发：system（后台任务、定时器或到期自动推进））
    - landed → cleansed：cleanse（触发：system（后台任务、定时器或到期自动推进））
    - cleansed → projected：project（触发：IngestBatch.project）
    - landed → failed：fail（触发：system（后台任务、定时器或到期自动推进））
    - cleansed → failed：fail（触发：system（后台任务、定时器或到期自动推进））
    - projected → superseded：supersede（触发：IngestBatch.supersede）
  actions:
  - id: IngestBatch.list
    kind: 查询
    summary: 文件导入批次
    permission:
    - advertisement:read
    - integration:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/finance/imports
    - GET /api/v1/ads/imports
    - GET /api/v1/ingest/batches
  - id: IngestBatch.create
    kind: 命令
    summary: 上传结算/订单文件并导入（异步任务，幂等：同文件哈希不重复）
    permission:
    - advertisement:import
    - attendance:write
    - integration:import
    - journal_entry:create
    aiMaxAutonomy: L3
    riskTier: 危：agent 禁用
    emits:
    - ingest_batch.created
    projections:
    - POST /api/v1/finance/imports
    - POST /api/v1/accounting/opening/imports
    - POST /api/v1/ads/imports
    - POST /api/v1/hr/attendance/imports
    - POST /api/v1/integrations/imports
  - id: IngestBatch.get
    kind: 查询
    summary: 导入批次详情（行数、拒绝行、重试）
    permission: integration:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/finance/imports/{id}
    - GET /api/v1/ingest/batches/{id}
  - id: IngestBatch.preview
    kind: 命令
    summary: 导入预览（映射、拒绝行）
    permission: integration:import
    aiMaxAutonomy: L3
    riskTier: 低：自动执行（不改业务数据或只产生可重算的派生结果）
    emits:
    - ingest_batch.preview.done
    projections:
    - POST /api/v1/integrations/imports/{id}/preview
  - id: IngestBatch.confirm
    kind: 命令
    summary: 确认导入（写入业务表，幂等）
    permission: integration:import
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - ingest_batch.confirmed
    projections:
    - POST /api/v1/integrations/imports/{id}/confirm
  - id: IngestBatch.project
    kind: 命令
    summary: 把通过清洗的记录投射为实体（幂等；钱和账相关实体只生成草稿）
    permission: integration:import
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - ingest_batch.projected
    projections:
    - POST /api/v1/ingest/batches/{id}/project
  - id: IngestBatch.supersede
    kind: 命令
    summary: 用新批次替代旧批次（不删除，旧投射通过补偿事件冲回）
    permission: integration:import
    aiMaxAutonomy: L0（仅真人）
    riskTier: 危：agent 禁用
    emits:
    - ingest_batch.superseded
    projections:
    - POST /api/v1/ingest/batches/{id}/supersede
- id: CleansingIssue
  nameZh: 清洗问题
  module: ingest（数据进入与溯源）
  kind: entity
  properties:
  - 'issueId: id'
  - 'batchId: id'
  - 'rowNo: int'
  - 'kind: enum(invalid/duplicate/unmapped/conflict)'
  - 'suggestion: Record'
  - 'handler: enum(agent/uploader/admin)'
  - 'agentAttempts: int'
  - 'assigneeUserId: id?(默认=批次上传人)'
  - 'moneyImpact: bool'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - in → IngestBatch
  stateMachine:
    states:
    - open
    - resolved
    - ignored
    - escalated
    transitions:
    - open → resolved：resolve（触发：CleansingIssue.resolve）
    - open → ignored：ignore（触发：CleansingIssue.resolve（参数 decision=ignore，必须写原因））
    - open → escalated：escalate（触发：CleansingIssue.escalate）
    - escalated → resolved：resolve（触发：CleansingIssue.resolve）
    - escalated → ignored：ignore（触发：CleansingIssue.resolve（参数 decision=ignore，必须写原因））
  actions:
  - id: CleansingIssue.list
    kind: 查询
    summary: 清洗问题：校验失败、疑似重复、映射缺失、口径冲突
    permission: integration:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/ingest/batches/{id}/issues
  - id: CleansingIssue.resolve
    kind: 命令
    summary: 处理清洗问题（agent 优先自动处理：补映射/判定重复/忽略并说明原因；涉及钱和账的结论降为人工确认）
    permission: integration:import
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - cleansing_issue.resolved
    projections:
    - POST /api/v1/ingest/batches/{id}/issues/{issueId}/resolve
  - id: CleansingIssue.escalate
    kind: 命令
    summary: agent 自动处理未果时转交上传该批数据的人（附 agent 尝试记录、证据与建议）
    permission: integration:import
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - cleansing_issue.escalated
    projections:
    - POST /api/v1/ingest/batches/{id}/issues/{issueId}/escalate

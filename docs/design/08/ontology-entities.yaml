- id: Delegation
  nameZh: 委托通行证
  module: agent（智能体中心）
  kind: entity
  properties:
  - 'delegationId: id'
  - 'userId: id'
  - 'sessionId: id'
  - 'threadId: id'
  - 'runId: id?'
  - 'scopes: string[](ActionType.id 子集)'
  - 'maxAutonomy: enum'
  - 'permissionsEpoch: int'
  - 'expiresAt: datetime(会话活跃时后台静默续期，单张最长 24 小时，到期前自动换新)'
  - 'tokenHash: string'
  - 'parentRunId: id?(子智能体继承)'
  - 'lastSeenAt: datetime'
  - 'revokeReason: enum(logout/switch_account/permission_changed/disabled/ai_off/session_expired)'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - for → UserAccount
  - boundTo → AgentRun
  stateMachine:
    states:
    - active
    - revoked
    - expired
    transitions:
    - active → active：renew（触发：system（会话活跃时后台静默续期/重新签发，用户无感））
    - active → revoked：revoke（触发：system（登出、切换账号、权限变化、停用、关闭 AI 时自动立即作废；无人工入口））
    - active → expired：expire（触发：system（后台任务、定时器或到期自动推进））
  actions:
  - id: Delegation.list
    kind: 查询
    summary: 委托通行证记录（系统自动签发/续期/作废；管理员审计用，普通用户看不到也无需操作）
    permission: audit_log:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/agent/delegations

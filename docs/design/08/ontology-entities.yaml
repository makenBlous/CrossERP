- id: AgentSuggestion
  nameZh: AI 建议
  module: agent（智能体中心）
  kind: entity
  properties:
  - 'suggestionId: id'
  - 'actionId: string(ActionType.id)'
  - 'params: Record'
  - 'autonomyLevel: enum'
  - 'confidence: enum'
  - 'evidence: Record[]'
  - 'onBehalfOf: id'
  - 'approvalId: id?'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - from → AgentRun
  - targets → ActionType
  - approvedVia → Approval
  stateMachine:
    states:
    - proposed
    - submitted
    - approved
    - rejected
    - executed
    - undone
    - dismissed
    - expired
    transitions:
    - proposed → submitted：submit（触发：AgentSuggestion.create（提交即进审批））
    - submitted → approved：approve（触发：Approval.decide（审批通过/驳回后由 approval.decided 事件推进））
    - submitted → rejected：reject（触发：Approval.decide（审批通过/驳回后由 approval.decided 事件推进））
    - approved → executed：execute（触发：system（审批通过后由动作执行器以原委托人身份执行同一实体动作，并重新校验权限））
    - executed → undone：undo（触发：AgentSuggestion.undo）
    - proposed → dismissed：dismiss（触发：AgentSuggestion.dismiss）
    - proposed → expired：expire（触发：system（后台任务、定时器或到期自动推进））
  actions:
  - id: AgentSuggestion.list
    kind: 查询
    summary: 智能体建议（生命周期）
    permission: agent_suggestion:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/agent/suggestions
  - id: AgentSuggestion.daily_summary
    kind: 查询
    summary: AI 每日自动执行摘要
    permission: agent_suggestion:read
    aiMaxAutonomy: L1
    riskTier: 无（只读）
    projections:
    - GET /api/v1/agent/daily-summary
  - id: AgentSuggestion.create
    kind: 命令
    summary: 提交建议→生成 origin=agent 草稿并进审批中心（不审批、不写账）
    permission: agent_suggestion:create
    aiMaxAutonomy: L3
    riskTier: 中：自动执行，可撤销；不设次数限额；事后只进每日一条站内摘要，不弹窗不推送
    emits:
    - agent_suggestion.created
    projections:
    - POST /api/v1/agent/suggestions
  - id: AgentSuggestion.undo
    kind: 命令
    summary: 撤销 24 小时内 AI 自动执行的低/中风险动作
    permission: agent_suggestion:create
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - agent_suggestion.undone
    projections:
    - POST /api/v1/agent/suggestions/{id}/undo
  - id: AgentSuggestion.dismiss
    kind: 命令
    summary: 忽略 L1 建议
    permission: agent_suggestion:read
    aiMaxAutonomy: L0
    riskTier: 危：agent 禁用
    emits:
    - agent_suggestion.dismissed
    projections:
    - POST /api/v1/agent/suggestions/{id}/dismiss

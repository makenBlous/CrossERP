- id: PurchaseOrder
  nameZh: 采购单
  module: proc（采购与供应商）
  kind: entity
  properties:
  - 'poId: id'
  - 'supplierId: id'
  - 'lines: {internalSku,qty,unitPrice:Money}[]'
  - 'total: Money'
  - 'origin: enum(human/agent/system)'
  - 'fromPlanLine: id?'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  relations:
  - from → Supplier
  - for → Sku
  - receivedBy → PurchaseReceipt
  - originatedFrom → ReplenishmentPlan
  stateMachine:
    states:
    - draft
    - pending
    - approved
    - rejected
    - partially_received
    - received
    - closed
    - cancelled
    transitions:
    - draft → pending：submit（触发：PurchaseOrder.submit）
    - pending → approved：approve（触发：Approval.decide（审批通过/驳回后由 approval.decided 事件推进））
    - pending → rejected：reject（触发：Approval.decide（审批通过/驳回后由 approval.decided 事件推进））
    - approved → partially_received：receive（触发：PurchaseReceipt.create（procurement.receipt.confirmed 事件推进））
    - partially_received → received：receive（触发：PurchaseReceipt.create（procurement.receipt.confirmed 事件推进））
    - received → closed：close（触发：system（全部收货且对账后关闭））
    - draft → cancelled：cancel（触发：PurchaseOrder.cancel）
    - approved → cancelled：cancel（触发：PurchaseOrder.cancel）
  actions:
  - id: PurchaseOrder.list
    kind: 查询
    summary: 采购单

  stateMachine:
    states:
    - pending
    - shipped
    - cancelled
    - partially_refunded
    - closed
    transitions:
    - pending → shipped：ship（触发：SalesOrder.ship）
    - pending → cancelled：cancel（触发：IngestBatch.project（平台订单状态随订单报告/同步投射，本系统不主动改平台订单））
    - shipped → partially_refunded：refund（触发：IngestBatch.project（退款随结算/订单报告投射））
    - shipped → closed：close（触发：system（结算对账完成后关闭））

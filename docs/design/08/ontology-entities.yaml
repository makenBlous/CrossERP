# CrossERP 实体目录草案（由 work/entities.txt + endpoints.dsl 生成；勿手改，改源表后重新生成）
ontology: CrossERP 业务对象目录（实体目录草案）
version: 0.4.0-draft
date: 2026-11-11 (Asia/Shanghai)
basedOn:
- 08-后端模块与API设计.md 第 9–12 章（v4）
- openapi-draft.yaml（每个操作的 x-crosserp.entity / x-crosserp.action）
- 前端 src/config/permissions.ts（权限点）
- CrossERP main=49101ad 只读快照
status: 设计草案；标“推断”的需实现时确认；会计/税务/人事口径为演示默认值，真实使用前需核实
summary:
  entityTypes: 166
  byKind:
    entity（业务实体（有状态机，可被动作改变））: 84
    config（配置对象）: 34
    record（只追加记录/事件（不可改，只能冲回））: 23
    meta（元数据/治理对象）: 8
    view（只读投影（不是实体，不能被动作改变））: 13
    twin（孪生状态实体（由外部事实同步 + 本系统流水推导））: 4
  actionTypes: 500
  apiOperations: 529
  twinSynced:
  - Store
  - Sku
  - Listing
  - SalesOrder
  - InventoryPosition
  - Shipment
  - Settlement
  - FxRate
  - CashTransaction
  - AdCampaign
  - CustomerReview
  - Employee
  stateMachineGaps: []
conventions:
  naming: 实体 PascalCase；动作 = 实体.动词（如 PurchaseOrder.submit）；事件 = snake_case 实体.过去式（如 purchase_order.submitted）
  apiIsProjection: 每个 HTTP 接口都是某个实体动作的投影：路由层只做“认证 → 解析参数 → 调 ActionDispatcher.execute(principal, actionId, params)”；MCP 工具、IM 卡片回调、定时任务、推演副本调用同一个 ActionDispatcher
  actionPipeline:
  - 解析调用人（人：会话/API Token；agent：委托令牌 → 被代表人）
  - 权限点（拒绝优先）
  - 数据范围与字段权限
  - 状态机合法性（ILLEGAL_TRANSITION）
  - 职责分离 / 不能自批
  - agent 额外：自主等级上限、钱和账最高 L2、委托作用域、发起人与会话核对
  - 业务校验（确定性计算，LLM 不算钱）
  - 同一事务：写实体新版本 + 操作日志 + 事件 outbox
  - 提交后：事件分发给调度器、通知、孪生、知识编译
  aiAutonomy:
    L0: 不可调用或仅真人
    L1: 只读、解释、提醒
    L2: agent 可以执行，但结果是草稿/待审项，人工审核后才生效
    L3: agent 直接执行生效，24 小时内可撤销
  riskTiers:
    rule: v4：只按动作会不会改动数据分级。所有只读动作（含对账查询、利润、凭证、余额、报表、薪资等钱和账的查询）一律 none，AI 可直接用；字段策略和数据范围照常生效
    none: 只读 → L1，AI 直接用
    low: 低风险（打标签、已读、对账计算/匹配/差异分析、试算、齐套校验、报表运行、副本推演、测试连通等，不改业务数据或只产生可重算的派生结果）→ L3 自动执行，不设次数上限
    medium: 中风险（非钱账主数据、业务草稿、CRM、知识、数据清洗处理、对账差异处理等，改数据但不改账）→ L3 自动执行；可撤销；不设次数限额；事后只进每日一条站内摘要
    high: 高风险（生成凭证、调整账务、过账、付款、核销、成本/汇率/分摊、对外发送、银行信息、提交审批、权限敏感主数据）→ L2，AI 最多到起草、待审
    critical: 高危（审批决定、权限与治理写操作、自主等级、密钥与模型设置、薪资发布、日志保留、期末结账）→ L0，agent 禁用
    subagents: 子智能体与主智能体同一分级、同一委托，不另开权限；子智能体不能调用 critical
  moneyAndLedgerCap: 只有改动钱和账的动作（生成凭证、调账、写账、导出写账、结转、付款、核销、薪资）受「AI 最多到起草、待审」限制；钱和账的只读查询与对账计算不受限。删除 L0（只作废不删）
  approvalRule: 审批人从流程配置解析：配置了就必须审批（法人/老大也一样），提交人与被代表人不能审批自己的单；没配置或解析不到可用账号 → 免审直接生效，操作日志记「无审批人，直接生效」（resolution=no_approver_auto）；反结账同此规则；AI 发起的高风险或钱账动作解析不到审批人 → 退回发起人本人确认后才生效（resolution=initiator_confirm，maken
    已定）
  kinds:
    entity: 业务实体（有状态机，可被动作改变）
    twin: 孪生状态实体（由外部事实同步 + 本系统流水推导）
    record: 只追加记录/事件（不可改，只能冲回）
    config: 配置对象
    meta: 元数据/治理对象
    view: 只读投影（不是实体，不能被动作改变）
ingestionPipeline:
  principle: 凌乱数据先原样落地，再清洗、校验、去重，最后投射为预制实体；任何实体字段都能追溯到原件行和规则版本
  stages:
  - stage: 1 落地 land
    what: 文件/接口返回原样存为 FileObject + RawRecord（不可变，SHA-256 去重）
    entity: IngestBatch(uploaded→landed), RawRecord
  - stage: 2 清洗 cleanse
    what: 编码/日期/币种/单位规范化，按 MappingRule 版本解析列；校验必填、金额、借贷、期间；生成 CleansingIssue
    entity: CleansingIssue, MappingRule
  - stage: 3 去重与实体解析 dedup
    what: 按自然键（订单号+店铺、结算 ID、文件哈希）精确去重；同物不同名（SKU/供应商/客户别名）进 DedupCandidate，确定性规则优先，AI 只给候选、人确认
    entity: DedupCandidate
  - stage: 4 投射 project
    what: 通过的记录映射为实体动作（如 Settlement.create、SalesOrder 状态更新、StockMovement 追加）；与人工操作走同一个 ActionDispatcher；钱和账相关只生成草稿
    entity: IngestBatch(cleansed→projected)
  - stage: 5 版本与溯源 version & lineage
    what: 每次投射写 EntityVersion（来源批次、原件行号、规则版本、操作者）；GET /entities/{type}/{id}/lineage 可从凭证一路追回原件
    entity: EntityVersion
  - stage: 6 事件调度 dispatch
    what: 实体事件进 outbox，调度器按订阅执行后续动作（对账、补货、孪生刷新、知识编译、通知）
    entity: EventType
  replay: 同一原件 + 同一规则版本 → 结果可重放、幂等；规则升级后可对历史批次“替代重投射”（supersede），旧投射用补偿事件冲回，不删除
  borrowedFrom: llm_wiki：原件不可变、内容哈希增量跳过、串行提交队列、两步“先分析后生成”、可疑项进异步审核（见 08 文档第 9.7 节）
digitalTwin:
  definition: 企业孪生 = 预制实体的当前状态 + 历史快照 + 与外部事实的同步与对账机制（参照 Digital Twin Consortium 定义与 Palantir Ontology 公开文档）
  twinEntities:
  - Store
  - Sku
  - Listing
  - InventoryPosition
  - Shipment（在途）
  - CashTransaction（资金）
  - Settlement
  - SalesOrder
  - Employee
  - FxRate
  - AdCampaign
  - CustomerReview
  sync: real-to-virtual：平台/海外仓/物流/银行数据经数据进入链路投射；virtual-to-real：只通过审批后的实体动作（以及写账出口）影响外部
  reconcile: 定时比对系统状态与外部事实，差异记 TwinDrift；agent 先自动处理（分类、修正非钱账偏差、确认时间差），仍解决不了转交该数据源的上传人/负责人（TwinDrift.escalate）；钱和账偏差只生成盘点/调整/冲销草稿走审批，不直接改账
  history: EntityVersion（逐次变更）+ TwinSnapshot（日终、月结、关键事件），asOf 时点回看
  simulation: TwinScenario 从快照派生副本；在副本上执行实体动作（同一套校验，写入隔离的 scenario 存储），不写真实实体、不写账、不发外部消息；promote 只把选中动作转成真实草稿并按原动作权限复核
knowledge:
  model: KnowledgePage 是挂在实体上的“编译后知识”：sources[] 指向原件/实体/问答，links 指向实体与其他知识页；按空间 ACL + 来源实体读权限双重过滤
  aiCurationScope: 所有空间（含薪资、合同）都由 AI 整理；整理任务只能读取发起者（或管理员）有权看的来源；产出页继承来源空间 ACL，不跨空间写入；敏感空间的整理结果不进入其他空间的检索与引用
  operations:
    compile: 新资料或实体事件触发增量编译（内容哈希未变则跳过），生成知识页草稿 + 审核项
    query: 检索结果只含调用人可见的页，回答带引用
    lint: 孤立页、断链、矛盾、过期、与实体数据不一致
  borrowedFrom: llm_wiki / Karpathy LLM Wiki：原件→Wiki→Schema 三层、sources[] 溯源、合并来源而不覆盖、链接只由程序插入、体检（见 08 文档第 9.7 节）
agentBinding:
  mode: 首选 SDK 嵌入：CrossERP 的 agent worker 进程内用 deerflow.client.DeerFlowClient 运行，不单独部署 DeerFlow Gateway/前端（见 08 文档第 10 章）
  toolSource: 'CrossERP 实体动作以进程内 LangChain 工具注册给 DeerFlow（config.yaml tools: use:），少量通用工具：查询实体、描述动作、预检、执行；可执行范围 = 被代表人当前权限 ∩ 智能体收窄 ∩ 委托作用域'
  identity: 委托通行证（Delegation）由系统在用户发起对话时自动签发，会话活跃时后台静默续期，登出/切换账号/权限变化/停用/关闭 AI 时自动立即作废；用户看不到、也不用管；嵌入模式下 CrossERP 通过 stream(user_id=…, authz_attributes={crosserp_delegation_id}) 传入，DeerFlow
    把 user_id、run_id、authz_attributes 原样传给子智能体；工具在进程内按委托 ID 回查数据库并按被代表人当前权限校验（不用网络令牌）
  subagents: 子智能体与主智能体同一委托、同一风险分级；高风险动作仍须人工审核
  worker: agent 跑在独立 worker 进程、独立 Python 虚拟环境（DeerFlow 依赖与 CrossERP API 进程隔离）；与 API 进程通过 MySQL 任务表 + 内部事件通信
  model: OpenAI 兼容（baseUrl、apiKey、model），在前端「模型设置」页填写；apiKey 加密存 MySQL、不回显、不进日志；worker 启动或配置变更时解密并以进程内 ModelConfig 交给 DeerFlowClient
  noCodeExecution: 禁止 AI 执行代码：不配置 bash 与文件读写工具、allow_host_bash=false、不装 Docker/AIO 沙箱、关闭 skill_evolution；以后的脚本库只能注册成功能函数或 MCP 工具，同样走实体动作权限与风险分级
  seeChapter: 08 文档第 10 章

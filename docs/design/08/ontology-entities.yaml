- id: AgentMode
  nameZh: AI 总开关
  module: agent（智能体中心）
  kind: config
  properties:
  - 'mode: enum(normal/degraded/off)'
  - 'changedBy: id'
  - 'version: int（乐观锁）'
  - 'createdAt/updatedAt: datetime(UTC)'
  - 'provenance: {batchId?, rawRecordIds?, actionId?, actorType, actorId, onBehalfOf?}'
  stateMachine:
    states:
    - normal
    - degraded
    - 'off'
    transitions:
    - normal → degraded：degrade（触发：AgentMode.update（推断：作为字段更新处理，实现时可拆成独立动作））
    - degraded → normal：restore（触发：AgentMode.update（推断：作为字段更新处理，实现时可拆成独立动作））
    - normal → off：turn_off（触发：AgentMode.update（推断：作为字段更新处理，实现时可拆成独立动作））
    - off → normal：restore（触发：AgentMode.update（推断：作为字段更新处理，实现时可拆成独立动作））
  actions:

  relations:
  - from → Settlement
  - from → CogsRun
  - from → LandedCostVoucher
  - approvedVia → Approval
  - exportedAs → ExportPackage
  stateMachine:
    states:
    - draft
    - pending
    - approved
    - rejected
    - posted
    - reversed
    transitions:
    - draft → pending：submit（触发：Voucher.submit）
    - pending → approved：approve（触发：Approval.decide（审批通过/驳回后由 approval.decided 事件推进））
    - pending → rejected：reject（触发：Approval.decide（审批通过/驳回后由 approval.decided 事件推进））
    - rejected → draft：revise（触发：Voucher.update（推断：作为字段更新处理，实现时可拆成独立动作））
    - approved → posted：post（触发：ledger 唯一写账出口（审批通过后过账，ADR 0001））
    - posted → reversed：reverse（触发：Voucher.reverse）
  actions:

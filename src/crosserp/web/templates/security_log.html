<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>登录日志</title></head>
<body><h1>登录日志</h1><a href="/">首页</a><table><tr><th>时间</th><th>事件</th><th>用户名</th><th>IP</th><th>详情</th></tr>
{% for row in rows %}<tr><td>{{ row.ts }}</td><td>{{ row.event }}</td><td>{{ row.username or '' }}</td><td>{{ row.ip or '' }}</td><td>{{ row.detail_json or '' }}</td></tr>{% endfor %}</table></body></html>

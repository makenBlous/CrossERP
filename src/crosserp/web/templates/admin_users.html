<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>用户管理</title></head>
<body><h1>用户管理</h1><a href="/">首页</a><table><tr><th>用户名</th><th>状态</th><th>角色</th></tr>{% for item, roles in users %}<tr><td>{{ item.username }}</td><td>{{ '启用' if item.is_active else '停用' }}</td><td>{{ roles|join(',') }}</td></tr>{% endfor %}</table>
<h2>新建用户</h2><form method="post"><input name="username" placeholder="用户名" required><input name="password" type="password" minlength="10" required><select name="role"><option>viewer</option><option>operator</option><option>finance</option><option>auditor</option><option>admin</option></select><input type="hidden" name="csrf_token" value="{{ request.cookies.get('crosserp_csrf', '') }}"><button>创建</button></form></body></html>

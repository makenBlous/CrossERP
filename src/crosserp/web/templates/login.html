<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>登录 - CrossERP</title></head>
<body><h1>CrossERP 登录</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login"><label>用户名 <input name="username" autocomplete="username" required></label>
<label>密码 <input type="password" name="password" autocomplete="current-password" required></label>
<input type="hidden" name="next" value="{{ next }}"><input type="hidden" name="csrf_token" value="{{ request.cookies.get('crosserp_login_csrf', '') }}"><button type="submit">登录</button></form></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>异常清单</title></head>
<body><h1>异常清单</h1><a href="/">首页</a>{% if user %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ request.cookies.get('crosserp_csrf', '') }}"><button>退出</button></form>{% endif %}<form method="get"><label>原因码 <input name="kind" value="{{ kind or '' }}"></label><label>严重度 <input name="severity" value="{{ severity or '' }}"></label><button>筛选</button></form>
<table><tr><th>原因码</th><th>中文名</th><th>严重度</th><th>说明</th><th>建议</th></tr>{% for issue, item, text in rows %}<tr><td>{{ issue.kind }}</td><td>{{ item.name_zh }}</td><td>{{ issue.severity }}</td><td>{{ text }}</td><td>{{ item.action_zh }}</td></tr>{% endfor %}</table></body></html>

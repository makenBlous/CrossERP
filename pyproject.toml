[project]
name = "crosserp"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "fastapi>=0.162",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.14",
    "python-calamine>=0.9",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1",
    "typer>=0.27",
    "uvicorn>=0.54.0",
]

[project.scripts]
crosserp = "crosserp.cli:app"

# 内置连接器也走这一组。
[project.entry-points."crosserp.connectors"]
amazon_settlement_v2 = "crosserp.connectors.amazon_settlement_v2:AmazonSettlementV2Connector"
mapped = "crosserp.connectors.generic_mapped.connector:GenericMappedConnector"
"shopify.payouts" = "crosserp.connectors.shopify_payouts:ShopifyPayoutsConnector"

[project.optional-dependencies]
mysql = [
    "pymysql>=1.2",
]
postgres = [
    "psycopg[binary]>=3.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["crosserp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: 需要数据库的测试",
    "guard: 红线守卫测试",
    "slow: 慢速测试",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

  expected_facts: ["INT-MUG-300", "472.0000"]
  must_cite: [{table: profit_snapshot, key: internal_sku, value: INT-MUG-300}]
  must_refuse: false
- id: profit_rank_02
  question: "Amazon.com 2026-10 哪个可计算 SKU 利润最低？"
